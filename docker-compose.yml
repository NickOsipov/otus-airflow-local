services:
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=airflow
    restart: always
    ports:
      - 5434:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

  airflow:
    build: .
    image: airflow-local:latest
    restart: always
    container_name: airflow
    depends_on:
      - postgres
    ports:
      - 8001:8080
    volumes:
      - ./airflow/dags:/usr/local/airflow/dags
      - ./airflow/plugins:/root/airflow/plugins
      - ./config/airflow.cfg:/etc/airflow/config/airflow.cfg
      - ./data:/root/data
      - logs:/usr/local/airflow/logs

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  pgdata:
  logs: